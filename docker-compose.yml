version: "3"

services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/catalogue/01_catalogue_ddl.sql:/docker-entrypoint-initdb.d/01_catalogue_ddl.sql
      - ./database/catalogue/02_catalogue_dml.sql:/docker-entrypoint-initdb.d/02_catalogue_dml.sql
      - ./database/orders/01_orders_ddl.sql:/docker-entrypoint-initdb.d/03_orders_ddl.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka:
    build:
      dockerfile: Dockerfile
      context: ./back-end-eureka
    ports:
      - "8761:8761"

  orders1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue1:8080/catalogue-service/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started

  orders2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    ports:
      - "8081:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue1:8080/catalogue-service/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started

  orders3:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    ports:
      - "8082:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue1:8080/catalogue-service/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started

  catalogue1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    ports:
      - "8083:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/catalogue_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started

  catalogue2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    ports:
      - "8084:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/catalogue_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started

volumes:
  postgres_data: