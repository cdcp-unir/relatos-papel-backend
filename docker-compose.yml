

services:
  postgres:
    image: postgres:15
    container_name: relatos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/catalogue/01_catalogue_ddl.sql:/docker-entrypoint-initdb.d/01_catalogue_ddl.sql
      - ./database/catalogue/02_catalogue_dml.sql:/docker-entrypoint-initdb.d/02_catalogue_dml.sql
      - ./database/orders/01_orders_ddl.sql:/docker-entrypoint-initdb.d/03_orders_ddl.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - relatos-net

  eureka:
    build:
      context: ./back-end-eureka
      dockerfile: Dockerfile
    container_name: relatos_eureka
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
      EUREKA_HOST: eureka
    networks:
      - relatos-net

  gateway:
    build:
      context: ./back-end-gateway
      dockerfile: Dockerfile
    container_name: relatos_gateway
    ports:
      - "8762:8762"
    environment:
      PORT: 8762
      EUREKA_URL: http://eureka:8761/eureka/
      ROUTE_TABLES_ENABLED: read_only
      ALLOWED_ORIGINS: "*"
    depends_on:
      eureka:
        condition: service_started
    networks:
      - relatos-net

  catalogue1:
    build:
      context: ./back-end-books-catalogue
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/catalogue_db
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - relatos-net

  catalogue2:
    build:
      context: ./back-end-books-catalogue
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/catalogue_db
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - relatos-net

  orders1:
    build:
      context: ./back-end-books-orders
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/books_orders
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
    networks:
      - relatos-net

  orders2:
    build:
      context: ./back-end-books-orders
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/books_orders
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
    networks:
      - relatos-net

volumes:
  postgres_data:

networks:
  relatos-net:
    driver: bridge