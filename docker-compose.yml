version: "3.8"

services:
  db1:
    image: postgres:15
    container_name: relatos_db_catalogue
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalogue_data:/var/lib/postgresql/data
      - ./database/catalogue/01_catalogue_ddl.sql:/docker-entrypoint-initdb.d/01_catalogue_ddl.sql
      - ./database/catalogue/02_catalogue_dml.sql:/docker-entrypoint-initdb.d/02_catalogue_dml.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - relatos-net

  db2:
    image: postgres:15
    container_name: relatos_db_orders
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
      - ./database/orders/01_orders_ddl.sql:/docker-entrypoint-initdb.d/01_orders_ddl.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - relatos-net

  eureka:
    build:
      dockerfile: Dockerfile
      context: ./back-end-eureka
    container_name: relatos_eureka
    environment:
      PORT: 8761
      HOSTNAME: eureka
    ports:
      - "8761:8761"
    networks:
      - relatos-net

  catalogue1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    container_name: relatos_catalogue_1
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db1:5432/catalogue_db
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      db1:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - relatos-net

  catalogue2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    container_name: relatos_catalogue_2
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db1:5432/catalogue_db
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      db1:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - relatos-net

  orders1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    container_name: relatos_orders_1
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db2:5432/books_orders
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
      BOOKS_CATALOGUE_URL: http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
    networks:
      - relatos-net

  orders2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    container_name: relatos_orders_2
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db2:5432/books_orders
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
      BOOKS_CATALOGUE_URL: http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
    networks:
      - relatos-net

  orders3:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    container_name: relatos_orders_3
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db2:5432/books_orders
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      EUREKA_URL: http://eureka:8761/eureka/
      BOOKS_CATALOGUE_URL: http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
    networks:
      - relatos-net

  gateway:
    build:
      dockerfile: Dockerfile
      context: ./back-end-gateway
    container_name: relatos_gateway
    ports:
      - "8762:8762"
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      ALLOWED_ORIGINS: "*"
    depends_on:
      eureka:
        condition: service_started
      catalogue1:
        condition: service_started
      catalogue2:
        condition: service_started
      orders1:
        condition: service_started
      orders2:
        condition: service_started
      orders3:
        condition: service_started
    networks:
      - relatos-net

volumes:
  postgres_catalogue_data:
  postgres_orders_data:

networks:
  relatos-net:
    driver: bridge