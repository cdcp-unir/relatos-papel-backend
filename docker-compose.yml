version: "3"

services:

  db1:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/catalogue/01_catalogue_ddl.sql:/docker-entrypoint-initdb.d/01_catalogue_ddl.sql
      - ./database/catalogue/02_catalogue_dml.sql:/docker-entrypoint-initdb.d/02_catalogue_dml.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db2:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/orders/01_orders_ddl.sql:/docker-entrypoint-initdb.d/03_orders_ddl.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      dockerfile: Dockerfile
      context: ./back-end-gateway
    ports:
      - "8762:8762"
    environment:
      - EUREKA_URL=http://eureka:8761/eureka

  eureka:
    build:
      dockerfile: Dockerfile
      context: ./back-end-eureka
    environment:
      - PORT=8761
      - HOSTNAME=localhost
    ports:
      - "8761:8761"

  orders1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    environment:
      - DB_URL=jdbc:postgresql://db2:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started

  orders2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    environment:
      - DB_URL=jdbc:postgresql://db2:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started

  orders3:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-orders
    environment:
      - DB_URL=jdbc:postgresql://db2:5432/orders_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
      - BOOKS_CATALOGUE_URL=http://catalogue-service/api/v1
    depends_on:
      db2:
        condition: service_healthy
      eureka:
        condition: service_started

  catalogue1:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    environment:
      - DB_URL=jdbc:postgresql://db1:5432/catalogue_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
    depends_on:
      db1:
        condition: service_healthy
      eureka:
        condition: service_started

  catalogue2:
    build:
      dockerfile: Dockerfile
      context: ./back-end-books-catalogue
    environment:
      - DB_URL=jdbc:postgresql://db1:5432/catalogue_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=postgres
      - DB_PASSWORD=password
      - EUREKA_URL=http://eureka:8761/eureka
    depends_on:
      db1:
        condition: service_healthy
      eureka:
        condition: service_started

volumes:
  postgres_data: