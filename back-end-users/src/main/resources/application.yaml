server:
  port: ${PORT:0}

spring:
  application:
    name: users-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/users_db}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

