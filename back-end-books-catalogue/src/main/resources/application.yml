server:
  port: 8081

spring:
  application:
    name: catalogue-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogue_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Adrian30@}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

## Logging Configuration
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.jpa: DEBUG

## Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: catalogue_service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: catalogue-service
    description: Microservicio de catálogo para Relatos de Papel
    version: 1.0.0
