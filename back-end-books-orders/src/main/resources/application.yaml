server:
  port: ${PORT:8081}

spring:
  application:
    name: orders-service
    ##Rabbitmq configuracion
  RabbitMQ:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VHOST:/}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/books_orders}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    hostname: ${EUREKA_HOSTNAME:localhost}

management:
  endpoint:
    web:
      exposure:
        include: health,info

##Rabbitmq Configuracion de eventos
rabbitmq:
  exchange:
    orders: pedido.creado
  routing:
    key:
      order:
        created: order.created
