server:
  port: ${PORT:0}

spring:
  application:
    name: orders-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/books_orders}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Adrian30@}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info