server:
  port: ${PORT:0}

spring:
  application:
    name: comms-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

gemini:
  api-key: ${GEMINI_API_KEY}