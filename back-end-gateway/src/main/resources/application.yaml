server:
  port: ${PORT:8762}

eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Ruta HTTP para SockJS:
            # /comms-service/ws/chat/info
            # /comms-service/ws/chat/{server}/{session}/xhr
            # etc.
            - id: comms-service-sockjs-http
              uri: lb://comms-service
              predicates:
                - Path=/comms-service/ws/**
              filters:
                - StripPrefix=1

            # Ruta WebSocket real:
            # /comms-service/ws/chat/{server}/{session}/websocket
            - id: comms-service-websocket
              uri: lb:ws://comms-service
              predicates:
                - Path=/comms-service/ws/**
                - Header=Upgrade, websocket
              filters:
                - StripPrefix=1

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${ALLOWED_ORIGINS:*}
                allowedHeaders: "*"
                allowedMethods:
                  - GET
                  - POST

management:
  endpoint:
    gateway:
      access: ${ROUTE_TABLES_ENABLED:read_only}
  endpoints:
    web:
      exposure:
        include:
          - '*'

services:
  users:
    url: ${USERS_SERVICE_URL:http://users-service:8080}